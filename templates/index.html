{% extends "base.html" %}

{% block cards %}
<div class="cards">
    {% for card in config.extra.card %}
    <article>
        <picture>
            <img width="100%" height="100%" src="/images/{{card['img']}}">
        </picture>
        <div class="cardtitle">{{card['title']}}</div>
        <a href="{{card['url']}}" rel="noreferrer"></a>
    </article>
    {% endfor %}
</div>
{% endblock cards %}
